<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockPapperScissor</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="game">

        

        <div class="hand">

            <div class="heading">
                <div class="you-heading">You</div>
                <div class="Computer-heading">Computer</div>
            </div>

            <div class="you-div">
                👊
            </div>
            <div class="computer-div">
                👊
            </div>
        </div>

        <div class="choices">
            <div class="choice" id="stone" onclick="resetGame()">👊</div>
            <div class="choice" id="paper" onclick="resetGame()">🖐️</div>
            <div class="choice" id="scissor" onclick="resetGame()">✌️</div>
        </div>

        <div class="score-board">
            <p>You: <span id="user-score">0</span></p>
            <p>Computer: <span id="computer-score">0</span></p>
        </div>

        <div class="result">
            Play
        </div>

        <div class="reset" onclick="resetGame1()">
            Reset
        </div>

    </div>





    <script src="script.js"></script>
</body>
</html>
